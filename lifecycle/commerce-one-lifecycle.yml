company_status: defunct
summary: >-
  Commerce One, Inc. filed for bankruptcy in October 2004 and no longer exists as
  an operating company. Its patent portfolio was bought by Novell subsidiary JGR
  Acquisitions in December 2004; remaining assets went to ComVest Partners, and
  the Commerce One name was acquired by Perfect Commerce in February 2006. The
  only Commerce One technical surface still reachable on the public internet is
  xcbl.org, a static archival site that still serves the xCBL schema library and
  its documentation over plain HTTP.
