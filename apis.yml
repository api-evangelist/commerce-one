aid: commerce-one
name: Commerce One
description: >-
  Commerce One, Inc. was a Pleasanton, California B2B e-commerce software company
  and one of the defining names of the dot-com era, running the MarketSite
  marketplace and the Global Trading Web trading network. Founded in 1994 as
  DistriVision and renamed Commerce One in 1997, it went public in July 1999 and
  peaked in 2000 at a $21.5B market capitalization on $401M of revenue. It filed
  for bankruptcy in October 2004; its patent portfolio went to Novell subsidiary
  JGR Acquisitions and the Commerce One name to Perfect Commerce in 2006. The
  company no longer operates and has no live API or developer portal. What
  survives, and what this profile documents, is xCBL — the XML Common Business
  Library — a royalty-free library of 44 XML business documents across 9
  namespaces, still published and downloadable from xcbl.org. Commerce One also
  created SOX, the schema language that influenced W3C XML Schema and JAXB.
