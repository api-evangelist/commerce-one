apis:
- aid: commerce-one:xcbl
  name: xCBL — XML Common Business Library
  description: >-
    xCBL 4.0 is a royalty-free library of XML business documents and reusable
    components for business-to-business e-commerce, published by Commerce One and
    still distributed from xcbl.org. It is a document-exchange vocabulary rather
    than an HTTP API: 44 business documents across a shared core namespace and
    eight functional-area namespaces (order management, pre-order management,
    financial, materials management, message management, application integration,
    catalog, statistics and forecasting). Version 4.0, released March 2003, is the
    first to use W3C XML Schema (XSDL) as its canonical form, replacing Commerce
    One's own SOX schema language, and represents an initial alignment with OASIS
    UBL. The distribution ships 709 .xsd modules plus valid sample instances.
  humanURL: http://xcbl.org/xcbl40/xcbl40.shtml
  baseURL: http://xcbl.org
