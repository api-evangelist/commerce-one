notes: >-
  xCBL 4.0 splits the previously monolithic namespace into a shared "core"
  namespace of reusable types plus independent functional-area namespaces, each
  referencing only core. Functional namespaces do not reference each other, so
  each can be versioned independently. Namespace URIs use the rrn:org.xcbl:
  scheme. Design is an initial alignment with the OASIS Universal Business
  Language (UBL) initiative; semantics derive from xCBL 3.5, EDI and RosettaNet.
